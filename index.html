<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Zamboanga Tricycle Fare Meter</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#111111">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, sans-serif; }
  body { background: #111; color: #eee; text-align: center; padding: 12px; }
  h2 { margin-bottom: 6px; }
  .screen {
    background: #000; border: 3px solid #333; border-radius: 12px;
    padding: 24px 12px; margin: 8px auto; max-width: 400px;
  }
  /* 🔠 BIG fare display */
  #fare {
    font-size: 6.5em;
    font-weight: 900;
    color: #4f4;
    line-height: 1.1;
    text-shadow: 0 0 20px rgba(51, 255, 51, 0.5);
    letter-spacing: 2px;
    transition: color 0.3s, text-shadow 0.3s;
  }
  /* ✨ Fare flash animations */
  #fare.increased {
    color: #ffdd00;
    text-shadow: 0 0 30px rgba(255, 221, 0, 0.9);
    animation: pulse 0.6s ease-in-out 2;
  }
  #fare.decreased {
    color: #4fc3ff;
    text-shadow: 0 0 30px rgba(79, 195, 255, 0.9);
  }
  @keyframes pulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.08); }
  }

  #fareBreakdown { color: #999; font-size: 0.85em; min-height: 1.2em; margin-top: 4px; }
  #distance { font-size: 1.8em; color: #8cf; }
  #speed { font-size: 1.3em; color: #fa4; }
  .info { color: #888; font-size: 0.8em; margin-top: 4px; }
  button {
    font-size: 1.1em; padding: 12px 20px; margin: 5px; border: none;
    border-radius: 10px; cursor: pointer; color: #fff;
  }
  #start { background: #2a2; }
  #stop { background: #c33; }
  #reset { background: #555; }
  .pax { background: #26a; font-size: 1.2em; padding: 10px 16px; }
  .disc { background: #7a5; }
  .disc.on { background: #3a3; box-shadow: 0 0 8px #3a3; }
  .status { color: #aaa; font-size: 0.9em; min-height: 1.4em; margin: 6px 0; }
  .locked { color: #f80 !important; }

  /* Fare matrix table */
  table { margin: 8px auto; border-collapse: collapse; font-size: 0.85em; }
  td, th { border: 1px solid #444; padding: 4px 10px; }
  th { background: #222; color: #fc3; }
  td { color: #eee; }
  .activeRow { background: #2a2a00; color: #ff4; font-weight: bold; }

  /* Dispute log */
  #tripLogDisplay {
    text-align: left; font-size: 0.8em; color: #aaa;
    max-height: 150px; overflow-y: auto;
  }
</style>
</head>
<body>

<h2>🛺 Zamboanga Fare Meter</h2>
<div class="info">Ordinance 617 — Fare Matrix</div>

<!-- MAIN FARE DISPLAY -->
<div class="screen">
  <div id="fare">₱0.00</div>
  <div id="fareBreakdown"></div>
  <div id="distance">0 m</div>
  <div id="speed">0.0 km/h</div>
  <div class="info" id="fixInfo">Waiting for GPS fix…</div>
  <div class="info" id="pointsInfo">Points: 0</div>
</div>

<!-- PASSENGER COUNTER -->
<div>
  <button class="pax" id="paxMinus">➖</button>
  <span id="paxDisplay">Passengers: 1</span>
  <button class="pax" id="paxPlus">➕</button>
</div>

<!-- DISCOUNTS -->
<div>
  <button class="disc" id="discSenior">👴 Senior</button>
  <button class="disc" id="discStudent">🎒 Student</button>
  <button class="disc" id="discPwd">♿ PWD</button>
</div>

<div class="status" id="status"></div>

<button id="start">▶ START TRIP</button>
<button id="stop">⏹ END</button>
<button id="reset">↺ RESET</button>

<!-- DISPUTE LOG -->
<div class="screen">
  <div class="info" style="color:#fa4">⚖️ Dispute Log (Current Trip)</div>
  <div id="tripLogDisplay">No fare changes yet.</div>
  <button id="exportBtn" style="background:#26a; margin-top:8px;">📥 Export CSV</button>
  <button id="viewHistoryBtn" style="background:#555;">📂 Export All History</button>
</div>

<!-- FARE MATRIX -->
<div class="screen">
  <div class="info" style="color:#fc3">📋 Official Fare Matrix (Ordinance 617)</div>
  <table id="matrixTable"></table>
</div>

<script>
// ==================== OFFICIAL FARE MATRIX (Ordinance 617) ====================
const FARE_MATRIX = [
  { km: 1, fare: 35 },
  { km: 2, fare: 45 },
  { km: 3, fare: 55 },
  { km: 4, fare: 65 },
  { km: 5, fare: 75 },
  { km: 6, fare: 85 },
  { km: 7, fare: 95 },
  { km: 8, fare: 105 },
  { km: 9, fare: 115 },
  { km: 10, fare: 125 },
];
const PAX_BASE_INCLUDED = 2;
const PAX_RATE = 10;
const DISCOUNT_RATE = 0.20;
const CURRENCY = "₱";

// ==================== GPS SETTINGS ====================
const MIN_ACCURACY = 15;
const MOVEMENT_THRESHOLD = 8;
const CURRENT_STATE_KEY = "faremeter_active_trip"; // NEW: Key para sa auto-save

// ==================== STATE ====================
let lastPoint = null;
let movingDistance = 0;
let pointCount = 0;
let gpsLocked = false;
let tripStarted = false;
let passengers = 1;
let discounts = { senior: false, student: false, pwd: false };
let lastFare = 0;

// Log / history state
let tripLog = [];
let tripHistory = [];
let tripStartTime = null;

const el = id => document.getElementById(id);

// ==================== AUTO-SAVE / RESUME LOGIC (NEW) ====================
function saveCurrentTripState() {
  if (!tripStarted) return;
  const state = {
    tripStarted,
    tripStartTime: tripStartTime ? tripStartTime.toString() : null,
    movingDistance,
    lastFare,
    passengers,
    discounts,
    lastPoint,
    tripLog
  };
  localStorage.setItem(CURRENT_STATE_KEY, JSON.stringify(state));
}

function restoreCurrentTripState() {
  try {
    const saved = localStorage.getItem(CURRENT_STATE_KEY);
    if (saved) {
      const state = JSON.parse(saved);
      if (state.tripStarted) {
        tripStarted = state.tripStarted;
        tripStartTime = state.tripStartTime ? new Date(state.tripStartTime) : new Date();
        movingDistance = state.movingDistance || 0;
        lastFare = state.lastFare || 0;
        passengers = state.passengers || 1;
        discounts = state.discounts || { senior: false, student: false, pwd: false };
        lastPoint = state.lastPoint || null;
        tripLog = state.tripLog || [];

        // Restore UI states
        el("paxDisplay").textContent = "Passengers: " + passengers;
        el("discSenior").classList.toggle("on", discounts.senior);
        el("discStudent").classList.toggle("on", discounts.student);
        el("discPwd").classList.toggle("on", discounts.pwd);

        updateDisplay();
        updateLogDisplay();
        setStatus("Active trip resumed from background", false);
      }
    }
  } catch(e) {
    console.error("Failed to restore trip state", e);
  }
}

function clearCurrentTripState() {
  localStorage.removeItem(CURRENT_STATE_KEY);
}

// ==================== FARE ENGINE ====================
function distanceToFare(dist) {
  if (dist <= 1000) return FARE_MATRIX[0].fare;
  const extraKm = Math.min(
    Math.ceil((dist - 1000) / 1000),
    FARE_MATRIX.length - 1
  );
  return FARE_MATRIX[extraKm].fare;
}

function calculateFare(dist) {
  let fare = distanceToFare(dist);
  const extraPax = Math.max(0, passengers - PAX_BASE_INCLUDED);
  fare += extraPax * PAX_RATE;

  const discountedCount =
    (discounts.senior ? 1 : 0) +
    (discounts.student ? 1 : 0) +
    (discounts.pwd ? 1 : 0);

  if (discountedCount > 0) {
    if (discountedCount >= passengers) {
      fare = fare * (1 - DISCOUNT_RATE);
    } else {
      const perHead = fare / passengers;
      fare = fare - perHead * discountedCount * DISCOUNT_RATE;
    }
  }
  return fare;
}

// FIXED: Template string interpolation bugs
function fareBreakdownText(dist) {
  const base = distanceToFare(dist);
  const extraPax = Math.max(0, passengers - PAX_BASE_INCLUDED);
  let txt = `Matrix fare ${CURRENCY}${base}`;
  if (extraPax > 0) txt += ` + ${extraPax} × ${CURRENCY}${PAX_RATE} pax`;
  const d = Object.keys(discounts).filter(k => discounts[k]);
  if (d.length) txt += ` −20% (${d.join("/")})`;
  return txt;
}

// ==================== FARE MATRIX TABLE UI ====================
// FIXED: Table template literal bugs
function buildMatrixTable() {
  const t = el("matrixTable");
  let html = "<tr><th>Distance</th><th>Fare</th></tr>";
  FARE_MATRIX.forEach((row, i) => {
    const label = i === 0 ? "First 1 km" : `Up to ${row.km} km`;
    html += `<tr id="mrow${i}"><td>${label}</td><td>${CURRENCY}${row.fare}</td></tr>`;
  });
  t.innerHTML = html;
}

function highlightMatrixRow(dist) {
  FARE_MATRIX.forEach((row, i) => {
    const tr = el("mrow" + i);
    if (tr) tr.className = "";
  });
  let idx = 0;
  if (dist > 1000) {
    idx = Math.min(Math.ceil((dist - 1000) / 1000), FARE_MATRIX.length - 1);
  }
  const tr = el("mrow" + idx);
  if (tr) tr.className = "activeRow";
}

// ==================== DISPUTE LOG ====================
function logFareChange(from, to, reason) {
  const entry = {
    time: new Date().toLocaleTimeString(),
    date: new Date().toLocaleDateString(),
    from: from,
    to: to,
    distance: Math.round(movingDistance),
    reason: reason
  };
  tripLog.push(entry);
  updateLogDisplay();
}

// FIXED: String interpolation and formatting
function updateLogDisplay() {
  const box = el("tripLogDisplay");
  if (tripLog.length === 0) {
    box.innerHTML = "No fare changes yet.";
    return;
  }
  box.innerHTML = tripLog.slice().reverse().map(e => {
    const arrow = e.to > e.from ? "↑" : (e.to < e.from ? "↓" : "→");
    const color = e.to > e.from ? "#ff4" : "#4fc3ff";
    return `<div style="margin:3px 0; border-bottom:1px solid #222; padding-bottom:3px;">
      <span style="color:${color}">${arrow} ${CURRENCY}${e.from.toFixed(2)} → ${CURRENCY}${e.to.toFixed(2)}</span>
      <br><small>${e.time} • ${e.distance} m • ${e.reason}</small>
    </div>`;
  }).join("");
}

// ==================== HISTORY STORAGE (offline) ====================
function saveHistory() {
  try {
    if (tripHistory.length > 50) tripHistory = tripHistory.slice(-50);
    localStorage.setItem("faremeter_history", JSON.stringify(tripHistory));
  } catch(e) {}
}

function loadHistory() {
  try {
    const saved = localStorage.getItem("faremeter_history");
    if (saved) tripHistory = JSON.parse(saved);
  } catch(e) { tripHistory = []; }
}

// FIXED: CSV data formatting string literal bugs
function exportCSV(trips, filename) {
  let csv = "Date,Start,End,Distance(m),Fare,Passengers,Discounts,FareChanges\n";
  trips.forEach(t => {
    const changes = (t.changes || [])
      .map(c => `${c.time}: ${c.from}->${c.to} @ ${c.distance}m`)
      .join(" | ");
    csv += `"${t.date}","${t.startTime}","${t.endTime}",${t.distanceM},${t.fare},${t.passengers},"${t.discounts}","${changes}"\n`;
  });

  const blob = new Blob([csv], { type: "text/csv" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = `faremeter-${filename}-${Date.now()}.csv`;
  a.click();
  URL.revokeObjectURL(url);
}

// ==================== BEEP ====================
function beep() {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.connect(gain); gain.connect(ctx.destination);
    osc.frequency.value = 880;
    gain.gain.setValueAtTime(0.15, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.2);
    osc.start(); osc.stop(ctx.currentTime + 0.2);
  } catch(e) {}
}

// ==================== DISPLAY ====================
function updateDisplay() {
  const fare = calculateFare(movingDistance);
  const fareEl = el("fare");

  // ✨ Flash detection
  if (fare > lastFare && lastFare > 0) {
    fareEl.classList.remove("decreased");
    fareEl.classList.add("increased");
    setTimeout(() => fareEl.classList.remove("increased"), 1300);
    beep();
    logFareChange(lastFare, fare, "fare increase");
  } else if (fare < lastFare && lastFare > 0) {
    fareEl.classList.remove("increased");
    fareEl.classList.add("decreased");
    setTimeout(() => fareEl.classList.remove("decreased"), 1300);
    logFareChange(lastFare, fare, "discount applied");
  }
  lastFare = fare;

  fareEl.textContent = CURRENCY + fare.toFixed(2);
  el("fareBreakdown").textContent = tripStarted || movingDistance > 0
    ? fareBreakdownText(movingDistance) : "";
  el("distance").textContent = movingDistance >= 1000
    ? (movingDistance/1000).toFixed(2) + " km"
    : Math.round(movingDistance) + " m";
  el("pointsInfo").textContent = "Points: " + pointCount;
  highlightMatrixRow(movingDistance);
}

function setStatus(msg, isWarning) {
  el("status").textContent = msg;
  el("status").className = isWarning ? "status locked" : "status";
}

// ==================== GPS ====================
function haversine(a, b) {
  const R = 6371000;
  const φ1 = a.lat * Math.PI/180, φ2 = b.lat * Math.PI/180;
  const Δφ = (b.lat - a.lat) * Math.PI/180;
  const Δλ = (b.lng - a.lng) * Math.PI/180;
  const x = Math.sin(Δφ/2)**2 +
            Math.cos(φ1) * Math.cos(φ2) * Math.sin(Δλ/2)**2;
  return R * 2 * Math.atan2(Math.sqrt(x), Math.sqrt(1-x));
}

function onFix(pos) {
  const c = pos.coords;
  pointCount++;

  if (c.accuracy > MIN_ACCURACY) {
    setStatus(`Signal weak (±${Math.round(c.accuracy)}m), waiting…`, true);
    return;
  }

  if (!gpsLocked) {
    gpsLocked = true;
    if(!tripStarted) setStatus("GPS locked ✓ — press START TRIP when passenger boards");
  }

  el("fixInfo").textContent = `GPS accuracy: ±${Math.round(c.accuracy)} m`;

  if (c.speed !== null && !isNaN(c.speed)) {
    el("speed").textContent = (c.speed * 3.6).toFixed(1) + " km/h";
  }

  const current = { lat: c.latitude, lng: c.longitude };

  if (lastPoint && tripStarted) {
    const d = haversine(lastPoint, current);
    if (d > MOVEMENT_THRESHOLD) {
      movingDistance += d;
      lastPoint = current;
      updateDisplay();
      saveCurrentTripState(); // NEW: Save current state to localStorage every movement
    }
  } else if (!lastPoint) {
    lastPoint = current;
    if (tripStarted) saveCurrentTripState();
  }
}

function onError(err) {
  const msgs = {
    1: "Permission denied — allow location access",
    2: "Position unavailable — move to open area",
    3: "GPS timeout — still searching…"
  };
  setStatus(msgs[err.code] || err.message, true);
}

function startGPS() {
  if (!navigator.geolocation) {
    setStatus("Geolocation not supported", true);
    return;
  }
  navigator.geolocation.watchPosition(onFix, onError, {
    enableHighAccuracy: true, maximumAge: 0, timeout: 10000
  });
}

// ==================== BUTTONS ====================
el("start").onclick = () => {
  tripStarted = true;
  tripStartTime = new Date();
  tripLog = [];
  lastFare = 0;
  movingDistance = 0;
  
  // Set initial location as baseline if we have a lock already
  if (gpsLocked) {
    navigator.geolocation.getCurrentPosition(p => {
       lastPoint = { lat: p.coords.latitude, lng: p.coords.longitude };
       saveCurrentTripState();
    });
  }

  logFareChange(0, calculateFare(0), "TRIP START");
  lastFare = calculateFare(0);
  updateLogDisplay();
  setStatus("Trip running… fare calculating");
  saveCurrentTripState(); // NEW: Save initial state immediately
};

el("stop").onclick = () => {
  if (!tripStarted) return;
  tripStarted = false;
  const fare = calculateFare(movingDistance);
  logFareChange(lastFare, fare, "TRIP END");
  lastFare = fare;

  // Save to permanent history
  const trip = {
    date: new Date().toLocaleDateString(),
    startTime: tripStartTime ? tripStartTime.toLocaleTimeString() : "?",
    endTime: new Date().toLocaleTimeString(),
    distanceM: Math.round(movingDistance),
    fare: fare.toFixed(2),
    passengers: passengers,
    discounts: Object.keys(discounts).filter(k => discounts[k]).join(",") || "none",
    changes: [...tripLog]
  };
  tripHistory.push(trip);
  saveHistory();
  clearCurrentTripState(); // NEW: Clear the auto-resume data since trip is done

  setStatus(`Trip ended — Fare: ${CURRENCY}${fare.toFixed(2)} — saved to history ✓`);
};

el("reset").onclick = () => {
  lastPoint = null; movingDistance = 0; pointCount = 0; tripStarted = false;
  lastFare = 0; tripLog = [];
  el("fare").textContent = CURRENCY + "0.00";
  el("distance").textContent = "0 m";
  el("speed").textContent = "0.0 km/h";
  el("fareBreakdown").textContent = "";
  el("fare").classList.remove("increased", "decreased");
  updateLogDisplay();
  clearCurrentTripState(); // NEW: clear background state
  setStatus("Meter reset — ready for next trip");
  updateDisplay();
};

el("paxPlus").onclick = () => {
  passengers = Math.min(6, passengers + 1);
  el("paxDisplay").textContent = "Passengers: " + passengers;
  updateDisplay();
  saveCurrentTripState(); // NEW: save setting change
};
el("paxMinus").onclick = () => {
  passengers = Math.max(1, passengers - 1);
  el("paxDisplay").textContent = "Passengers: " + passengers;
  updateDisplay();
  saveCurrentTripState(); // NEW: save setting change
};

function toggleDiscount(key) {
  discounts[key] = !discounts[key];
  const btn = { senior: "discSenior", student: "discStudent", pwd: "discPwd" }[key];
  el(btn).classList.toggle("on", discounts[key]);
  updateDisplay();
  saveCurrentTripState(); // NEW: save setting change
}
el("discSenior").onclick = () => toggleDiscount("senior");
el("discStudent").onclick = () => toggleDiscount("student");
el("discPwd").onclick = () => toggleDiscount("pwd");

el("exportBtn").onclick = () => {
  exportCSV([{
    date: new Date().toLocaleDateString(),
    startTime: tripStartTime ? tripStartTime.toLocaleTimeString() : "?",
    endTime: new Date().toLocaleTimeString(),
    distanceM: Math.round(movingDistance),
    fare: calculateFare(movingDistance).toFixed(2),
    passengers: passengers,
    discounts: Object.keys(discounts).filter(k => discounts[k]).join(",") || "none",
    changes: tripLog
  }], "current-trip");
};

el("viewHistoryBtn").onclick = () => {
  if (tripHistory.length === 0) {
    setStatus("No saved trips yet", true);
    return;
  }
  exportCSV(tripHistory, "all-trips");
};

// ==================== KEEP SCREEN ON ====================
let wakeLock = null;
async function requestWakeLock() {
  try {
    wakeLock = await navigator.wakeLock.request("screen");
    wakeLock.addEventListener("release", () => { wakeLock = null; });
  } catch(e) {}
}
document.addEventListener("click", () => { if (!wakeLock) requestWakeLock(); });
requestWakeLock();

// ==================== PWA REGISTRATION ====================
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("sw.js")
    .then(() => console.log("Offline ready ✓"));
}

// ==================== INIT ====================
buildMatrixTable();
loadHistory();
restoreCurrentTripState(); // NEW: Check kung may naputol na trip
updateLogDisplay();
startGPS();
</script>
</body>
</html>
